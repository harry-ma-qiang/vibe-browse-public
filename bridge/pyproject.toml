[project]
name = "vibe-browse-bridge"
version = "0.1.0"
description = "A websocket and HTTP bridge between an AI agent and the browser extension"
license = "AGPL-3.0-or-later"
authors = [{ name = "harry-ma-qiang" }]
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

# why: one script, run in place, so this is a dependency environment and not a
# distributable package. Declare a build backend if it ever ships as one.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
